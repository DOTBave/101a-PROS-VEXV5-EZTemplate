name: cpp-linter

on:
  pull_request:
    branches: ["dev", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    name: C/C++ Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run C/C++ Linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: file
          tidy-checks: '-*'
          format-review: true
          ignore: 'include/EZ-Template|include/liblvgl|include/okapi|include/pros|include/api.h'

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
